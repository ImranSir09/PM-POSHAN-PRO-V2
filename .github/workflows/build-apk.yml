name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build
        env:
          VITE_SHEETDB_URL: ${{ secrets.VITE_SHEETDB_URL }}
          VITE_SHEETDB_API_KEY: ${{ secrets.VITE_SHEETDB_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Generate Native App Icons
        run: npm run generate:icons

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.1.${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: PM POSHAN PRO v2.1.${{ github.run_number }}
          body: |
            ### PM POSHAN PRO V2 Automated APK Release

            - **Version Name:** 2.1.${{ github.run_number }}
            - **Version Code:** ${{ github.run_number }}
            - **Build Date:** ${{ github.event.head_commit.timestamp || 'Latest' }}

            Download `app-debug.apk` below to install or update the app on your Android device.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
