name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build
        env:
          VITE_SHEETDB_URL: ${{ secrets.VITE_SHEETDB_URL }}
          VITE_SHEETDB_API_KEY: ${{ secrets.VITE_SHEETDB_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Generate Native App Icons
        run: npm run generate:icons

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Configure Keystore Signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding repository secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/signing.keystore
          fi
          if [ -f "android/app/signing.keystore" ]; then
            echo "Persistent signing keystore verified at android/app/signing.keystore"
          else
            echo "Keystore not found, falling back to default debug keystore"
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.1.${{ github.run_number }}
          KEYSTORE_FILE: signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'pmposhanpro2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pmposhan' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'pmposhanpro2026' }}

      - name: Prepare Named APK Artifacts
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/PM-POSHAN-PRO-v2.1.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/app-debug.apk
          cd release-output
          sha256sum PM-POSHAN-PRO-v2.1.${{ github.run_number }}.apk > SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pm-poshan-pro-v2.1.${{ github.run_number }}
          path: release-output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: PM POSHAN PRO v2.1.${{ github.run_number }}
          body: |
            ### PM POSHAN PRO V2 Automated APK Release

            - **Version Name:** 2.1.${{ github.run_number }}
            - **Version Code:** ${{ github.run_number }}
            - **Build Date:** ${{ github.event.head_commit.timestamp || 'Latest' }}

            #### Download Options:
            - **Branded Package:** `PM-POSHAN-PRO-v2.1.${{ github.run_number }}.apk`
            - **Direct Standard Package:** `app-debug.apk`

            *Verified SHA-256 checksums are attached for integrity verification.*
          files: |
            release-output/PM-POSHAN-PRO-v2.1.${{ github.run_number }}.apk
            release-output/app-debug.apk
            release-output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
